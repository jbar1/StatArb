    });
  }

  /* ── Left-drag → Y-axis pan (supplements Plotly native X pan) ───────── */

  var _lmbDown = false;
  var _lastY = 0;
  var _rafY = false;
  var _pendingY = 0;
  var _activePanel = null;

  function applyYPan() {
    _rafY = false;
    if (!_lmbDown || _pendingY === 0 || !_activePanel) return;
    var yi = axisInfo(_activePanel.yAxis);
    if (!yi || yi.length === 0) return;
    var shift = (_pendingY / yi.length) * (yi.r1 - yi.r0);
    _pendingY = 0;
    var newR0 = _activePanel.yAxis.l2r(yi.r0 + shift);
    var newR1 = _activePanel.yAxis.l2r(yi.r1 + shift);
    var update = {};
    setAxisRange(update, _activePanel.yKey, [newR0, newR1]);
    Plotly.relayout(gd, update);
  }

  gd.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var fl = gd._fullLayout;
    if (!fl) return;
    var rect = gd.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var panel = panelForMouse(fl, my);
    if (!panel) return;
    var xa = panel.xAxis;
    var ya = panel.yAxis;
    var inH = xa ? (mx >= (xa._offset || 0) && mx <= (xa._offset || 0) + (xa._length || 0)) : false;
    var inV = ya ? (my >= (ya._offset || 0) && my <= (ya._offset || 0) + (ya._length || 0)) : false;
    if (!inH || !inV) return;
    _lmbDown = true;
    _activePanel = panel;
    _lastY = e.clientY;
    _pendingY = 0;
    _rafY = false;
  }, true);

  window.addEventListener('mousemove', function (e) {
    if (!_lmbDown) return;
    _pendingY += e.clientY - _lastY;
    _lastY = e.clientY;
    if (!_rafY) { _rafY = true; requestAnimationFrame(applyYPan); }
  }, true);

  window.addEventListener('mouseup', function (e) {
    if (e.button !== 0) return;
    _lmbDown = false;
    _activePanel = null;
  }, true);

  /* ── Middle-mouse-button → temporary zoom-box mode ──────────────────── */

  gd.addEventListener('mousedown', function (e) {
    if (e.button !== 1) return;
    e.preventDefault();
    Plotly.relayout(gd, { dragmode: 'zoom' });

    function onMouseUp(evt) {
      if (evt.button !== 1) return;
      Plotly.relayout(gd, { dragmode: 'pan' });
      window.removeEventListener('mouseup', onMouseUp, true);
    }
    window.addEventListener('mouseup', onMouseUp, true);
  }, true);

  gd.addEventListener('auxclick', function (e) { if (e.button === 1) e.preventDefault(); });
  gd.addEventListener('contextmenu', function (e) { if (e.button === 1) e.preventDefault(); });

  /* ── scroll-wheel axis zoom ──────────────────────────────────────────── */

  var ZOOM_STEP = 0.15;

  function zoomAxisAround(ax, focus, factor) {
    var info = axisInfo(ax);
    if (!info) return null;
    var newR0 = focus - (focus - info.r0) * factor;
    var newR1 = focus + (info.r1 - focus) * factor;
    return [ax.l2r(newR0), ax.l2r(newR1)];
  }

  function zoomAxisMid(ax, factor) {
    var info = axisInfo(ax);
    if (!info) return null;
    var mid = (info.r0 + info.r1) / 2;
    var half = (info.r1 - info.r0) / 2 * factor;
    return [ax.l2r(mid - half), ax.l2r(mid + half)];
  }

  gd.addEventListener('wheel', function (e) {
    var fl = gd._fullLayout;
    if (!fl) return;

    var rect = gd.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;
    var panel = panelForMouse(fl, mouseY);
    var xPanel = panel || bottomPanel(fl);
    if (!xPanel) return;

    var xa = xPanel.xAxis;
    var plotLeft = xa ? (xa._offset || 0) : 0;
    var plotRight = xa ? (plotLeft + (xa._length || rect.width)) : rect.width;
    var inPlotH = (mouseX >= plotLeft && mouseX <= plotRight);

    var zone = null;
    if (panel) {
      zone = inPlotH ? 'both' : 'y';
    } else if (inPlotH) {
      var panels = collectPanels(fl);
      if (panels.length && mouseY >= (panels[0].yAxis._offset || 0)) {
        zone = 'x';
      }
    }
    if (!zone) return;

    e.preventDefault();
    e.stopPropagation();

    var factor = e.deltaY > 0 ? (1 + ZOOM_STEP) : (1 - ZOOM_STEP);
    var update = {};

    if (zone === 'both' || zone === 'x') {
      var xi = axisInfo(xa);
      if (xi) {
        var xr;
        if (zone === 'both') {
          var xFrac = (mouseX - plotLeft) / xa._length;
          var xFocus = xi.r0 + xFrac * (xi.r1 - xi.r0);
          xr = zoomAxisAround(xa, xFocus, factor);
        } else {
          xr = zoomAxisMid(xa, factor);
        }
        if (xr) setAllXRanges(fl, update, xr);
      }
    }

    if ((zone === 'both' || zone === 'y') && panel) {
      var ya = panel.yAxis;
      var yi = axisInfo(ya);
      if (yi) {
        var yr;
        if (zone === 'both') {
          var plotTop = ya._offset || 0;
          var yFrac = 1 - (mouseY - plotTop) / ya._length;
          var yFocus = yi.r0 + yFrac * (yi.r1 - yi.r0);
          yr = zoomAxisAround(ya, yFocus, factor);
        } else {
          yr = zoomAxisMid(ya, factor);
        }
        if (yr) setAxisRange(update, panel.yKey, yr);
      }
    }

    if (Object.keys(update).length) Plotly.relayout(gd, update);
  }, { passive: false });

  /* ── Vertical Line Spanning All Rows (Sync Crosshair) ────────────────── */

  gd.on('plotly_click', function (data) {
    if (!data || !data.points || !data.points.length) return;
    var x = data.points[0].x;
    var shapes = (gd.layout.shapes || []).filter(function (s) {
      return s.name !== 'click-crosshair';
    });
    shapes.push({
      type: 'line',
      x0: x, x1: x,
      y0: 0, y1: 1,
      xref: 'x', yref: 'paper',
      line: { color: '#AAAAAA', width: 1, dash: 'dot' },
      name: 'click-crosshair',
      layer: 'above'
    });
    Plotly.relayout(gd, { shapes: shapes });
  });

  gd.on('plotly_hover', function (data) {
    if (!data || !data.points || !data.points.length) return;
    var x = data.points[0].x;
    var shapes = (gd.layout.shapes || []).filter(function (s) {
      return s.name !== 'hover-crosshair';
    });
    shapes.push({
      type: 'line',
      x0: x, x1: x,
      y0: 0, y1: 1,
      xref: 'x', yref: 'paper',
      line: { color: 'rgba(255, 255, 255, 0.35)', width: 1, dash: 'dash' },
      name: 'hover-crosshair',
      layer: 'above'
    });
    Plotly.relayout(gd, { shapes: shapes });
  });

  gd.on('plotly_unhover', function (data) {
    var shapes = (gd.layout.shapes || []).filter(function (s) {
      return s.name !== 'hover-crosshair';
    });
    Plotly.relayout(gd, { shapes: shapes });
  });

})();

(function() {
  /* ── Close-Position Button ───────────────────────────────────────── */
  var PAIR_KEY    = 'MES_2YY';
  var SYM1        = 'MES';
  var SYM2        = '2YY';
  var HAS_POS     = false;
  var CFG_URL     = 'https://jbar1.github.io/StatArb/api_config.json';  /* fetched; not backed into HTML */

  /* Inject styles */
  var style = document.createElement('style');
  style.textContent = `
    #close-pos-btn {
      position: absolute;
      top: 150px;
      right: 95px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1.5px solid rgba(255,80,80,0.55);
      background: rgba(28,10,10,0.82);
      color: #ff6060;
      font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    #close-pos-btn.active:hover {
      background: rgba(60,10,10,0.9);
      border-color: #ff4040;
    }
    #close-pos-btn.disabled {
      opacity: 0.35;
      cursor: default;
      color: #aaa;
      border-color: #555;
    }
    #close-pos-btn .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    #close-confirm {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    #close-confirm-box {
      background: #1a1a2e;
      border: 1px solid #3a3a5e;
      border-radius: 12px;
      padding: 28px 32px;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    #close-confirm-box h3 {
      color: #e0e0ff;
      margin: 0 0 8px;
      font: 600 15px/1.4 'Segoe UI', system-ui, sans-serif;
    }
    #close-confirm-box p {
      color: #888;
      font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
      margin: 0 0 20px;
    }
    .close-btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .close-btn-row button {
      padding: 8px 22px;
      border-radius: 7px;
      border: none;
      font: 600 13px 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .close-btn-row button:hover { opacity: 0.85; }
    #close-confirm-yes {
      background: #c0392b;
      color: #fff;
    }
    #close-confirm-no {
      background: #2e2e4e;
      color: #ccc;
    }
    #close-status {
      margin-top: 12px;
      font: 13px 'Segoe UI', system-ui, sans-serif;
      min-height: 18px;
    }
  `;
  document.head.appendChild(style);

  /* Build button */
  var btn = document.createElement('div');
  btn.id = 'close-pos-btn';
  btn.innerHTML = '<span class="dot"></span> Close Position';
  var gd = document.querySelector('.plotly-graph-div');
  if (gd) {
    gd.appendChild(btn);
  } else {
    document.body.appendChild(btn);
  }

  /* Build confirmation overlay */
  var overlay = document.createElement('div');
  overlay.id = 'close-confirm';
  overlay.innerHTML = `
    <div id="close-confirm-box">
      <h3>&#x26A0; Close Position</h3>
      <p>Send a closing order for <strong>` + SYM1 + ` / ` + SYM2 + `</strong>?</p>
      <div class="close-btn-row">
        <button id="close-confirm-yes">&#x2705; Confirm</button>
        <button id="close-confirm-no">&#x2716; Cancel</button>
      </div>
      <div id="close-status"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  var statusEl   = document.getElementById('close-status');
  var confirmEl  = document.getElementById('close-confirm');
  var yesBtn     = document.getElementById('close-confirm-yes');
  var noBtn      = document.getElementById('close-confirm-no');

  function setStatus(msg, color) {
    statusEl.textContent = msg;
    statusEl.style.color = color || '#aaa';
  }

  /* Fetch api_config.json from GitHub Pages */
  var apiCfg = null;
  fetch(CFG_URL, { cache: 'no-cache' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(txt) {
      if (!txt) return null;
      try {
        // Decode the base64 obfuscated JSON
        return JSON.parse(atob(txt.trim()));
      } catch (e) {
        console.debug('[CloseBtn] Failed to decode api_config:', e);
        return null;
      }
    })
    .then(function(cfg) {
      if (!cfg || !cfg.api_url || !cfg.token) {
        console.debug('[CloseBtn] api_config.json missing or incomplete — button hidden.');
        return;
      }
      apiCfg = cfg;
      btn.style.display = 'flex';
      if (HAS_POS) {
        btn.classList.add('active');
        btn.title = 'Click to close ' + SYM1 + '/' + SYM2 + ' position';
      } else {
        btn.classList.add('disabled');
        btn.title = 'No open position for ' + SYM1 + '/' + SYM2;
      }
    })
    .catch(function(e) {
      console.debug('[CloseBtn] Could not load api_config.json:', e);
    });

  /* Button click → show confirmation */
  btn.addEventListener('click', function() {
    if (!btn.classList.contains('active')) return;
    setStatus('');
    confirmEl.style.display = 'flex';
  });

  /* Cancel */
  noBtn.addEventListener('click', function() {
    confirmEl.style.display = 'none';
  });

  /* Confirm → send close request */
  yesBtn.addEventListener('click', function() {
    if (!apiCfg) return;
    yesBtn.disabled = true;
    setStatus('Sending...', '#aaa');
    fetch(apiCfg.api_url + '/close_pair', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiCfg.token
      },
      body: JSON.stringify({ pair_key: PAIR_KEY })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok) {
        setStatus('✅ Close order sent', '#27AE60');
        btn.classList.remove('active');
        btn.classList.add('disabled');
        btn.title = 'Close order already sent';
        setTimeout(function() { confirmEl.style.display = 'none'; }, 1800);
      } else {
        setStatus('❌ ' + (res.data.error || 'Error'), '#E74C3C');
        yesBtn.disabled = false;
      }
    })
    .catch(function(e) {
      setStatus('❌ Network error: ' + e.message, '#E74C3C');
      yesBtn.disabled = false;
    });
  });

  /* Click outside box closes overlay */
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) confirmEl.style.display = 'none';
  });
})();

                        })                };            </script>        </div>
