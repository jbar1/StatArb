  var SYM1        = 'MYM';
  var SYM2        = 'MZW';
  var HAS_POS     = false;
  var CFG_URL     = 'https://jbar1.github.io/StatArb/api_config.json';  /* fetched; not backed into HTML */

  /* Inject styles */
  var style = document.createElement('style');
  style.textContent = `
    #close-pos-btn {
      position: absolute;
      top: 150px;
      right: 95px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1.5px solid rgba(255,80,80,0.55);
      background: rgba(28,10,10,0.82);
      color: #ff6060;
      font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    #close-pos-btn.active:hover {
      background: rgba(60,10,10,0.9);
      border-color: #ff4040;
    }
    #close-pos-btn.disabled {
      opacity: 0.35;
      cursor: default;
      color: #aaa;
      border-color: #555;
    }
    #close-pos-btn .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    #close-confirm {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    #close-confirm-box {
      background: #1a1a2e;
      border: 1px solid #3a3a5e;
      border-radius: 12px;
      padding: 28px 32px;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    #close-confirm-box h3 {
      color: #e0e0ff;
      margin: 0 0 8px;
      font: 600 15px/1.4 'Segoe UI', system-ui, sans-serif;
    }
    #close-confirm-box p {
      color: #888;
      font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
      margin: 0 0 20px;
    }
    .close-btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .close-btn-row button {
      padding: 8px 22px;
      border-radius: 7px;
      border: none;
      font: 600 13px 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .close-btn-row button:hover { opacity: 0.85; }
    #close-confirm-yes {
      background: #c0392b;
      color: #fff;
    }
    #close-confirm-no {
      background: #2e2e4e;
      color: #ccc;
    }
    #close-status {
      margin-top: 12px;
      font: 13px 'Segoe UI', system-ui, sans-serif;
      min-height: 18px;
    }
  `;
  document.head.appendChild(style);

  /* Build button */
  var btn = document.createElement('div');
  btn.id = 'close-pos-btn';
  btn.innerHTML = '<span class="dot"></span> Close Position';
  var gd = document.querySelector('.plotly-graph-div');
  if (gd) {
    gd.appendChild(btn);
  } else {
    document.body.appendChild(btn);
  }

  /* Build confirmation overlay */
  var overlay = document.createElement('div');
  overlay.id = 'close-confirm';
  overlay.innerHTML = `
    <div id="close-confirm-box">
      <h3>&#x26A0; Close Position</h3>
      <p>Send a closing order for <strong>` + SYM1 + ` / ` + SYM2 + `</strong>?</p>
      <div class="close-btn-row">
        <button id="close-confirm-yes">&#x2705; Confirm</button>
        <button id="close-confirm-no">&#x2716; Cancel</button>
      </div>
      <div id="close-status"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  var statusEl   = document.getElementById('close-status');
  var confirmEl  = document.getElementById('close-confirm');
  var yesBtn     = document.getElementById('close-confirm-yes');
  var noBtn      = document.getElementById('close-confirm-no');

  function setStatus(msg, color) {
    statusEl.textContent = msg;
    statusEl.style.color = color || '#aaa';
  }

  /* Fetch api_config.json from GitHub Pages */
  var apiCfg = null;
  fetch(CFG_URL, { cache: 'no-cache' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(txt) {
      if (!txt) return null;
      try {
        // Decode the base64 obfuscated JSON
        return JSON.parse(atob(txt.trim()));
      } catch (e) {
        console.debug('[CloseBtn] Failed to decode api_config:', e);
        return null;
      }
    })
    .then(function(cfg) {
      if (!cfg || !cfg.api_url || !cfg.token) {
        console.debug('[CloseBtn] api_config.json missing or incomplete — button hidden.');
        return;
      }
      apiCfg = cfg;
      btn.style.display = 'flex';
      if (HAS_POS) {
        btn.classList.add('active');
        btn.title = 'Click to close ' + SYM1 + '/' + SYM2 + ' position';
      } else {
        btn.classList.add('disabled');
        btn.title = 'No open position for ' + SYM1 + '/' + SYM2;
      }
    })
    .catch(function(e) {
      console.debug('[CloseBtn] Could not load api_config.json:', e);
    });

  /* Button click → show confirmation */
  btn.addEventListener('click', function() {
    if (!btn.classList.contains('active')) return;
    setStatus('');
    confirmEl.style.display = 'flex';
  });

  /* Cancel */
  noBtn.addEventListener('click', function() {
    confirmEl.style.display = 'none';
  });

  /* Confirm → send close request */
  yesBtn.addEventListener('click', function() {
    if (!apiCfg) return;
    yesBtn.disabled = true;
    setStatus('Sending...', '#aaa');
    fetch(apiCfg.api_url + '/close_pair', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiCfg.token
      },
      body: JSON.stringify({ pair_key: PAIR_KEY })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok) {
        setStatus('✅ Close order sent', '#27AE60');
        btn.classList.remove('active');
        btn.classList.add('disabled');
        btn.title = 'Close order already sent';
        setTimeout(function() { confirmEl.style.display = 'none'; }, 1800);
      } else {
        setStatus('❌ ' + (res.data.error || 'Error'), '#E74C3C');
        yesBtn.disabled = false;
      }
    })
    .catch(function(e) {
      setStatus('❌ Network error: ' + e.message, '#E74C3C');
      yesBtn.disabled = false;
    });
  });

  /* Click outside box closes overlay */
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) confirmEl.style.display = 'none';
  });
})();

                        })                };            </script>        </div>
</body>
</html>
