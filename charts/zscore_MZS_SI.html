      </div>
      <div id="close-status"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  var statusEl   = document.getElementById('close-status');
  var confirmEl  = document.getElementById('close-confirm');
  var yesBtn     = document.getElementById('close-confirm-yes');
  var noBtn      = document.getElementById('close-confirm-no');

  function setStatus(msg, color) {
    statusEl.textContent = msg;
    statusEl.style.color = color || '#aaa';
  }

  /* Fetch api_config.json from GitHub Pages */
  var apiCfg = null;
  fetch(CFG_URL, { cache: 'no-cache' })
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(txt) {
      if (!txt) return null;
      try {
        // Decode the base64 obfuscated JSON
        return JSON.parse(atob(txt.trim()));
      } catch (e) {
        console.debug('[CloseBtn] Failed to decode api_config:', e);
        return null;
      }
    })
    .then(function(cfg) {
      if (!cfg || !cfg.api_url || !cfg.token) {
        console.debug('[CloseBtn] api_config.json missing or incomplete — button hidden.');
        return;
      }
      apiCfg = cfg;
      btn.style.display = 'flex';
      if (HAS_POS) {
        btn.classList.add('active');
        btn.title = 'Click to close ' + SYM1 + '/' + SYM2 + ' position';
      } else {
        btn.classList.add('disabled');
        btn.title = 'No open position for ' + SYM1 + '/' + SYM2;
      }
    })
    .catch(function(e) {
      console.debug('[CloseBtn] Could not load api_config.json:', e);
    });

  /* Button click → show confirmation */
  btn.addEventListener('click', function() {
    if (!btn.classList.contains('active')) return;
    setStatus('');
    confirmEl.style.display = 'flex';
  });

  /* Cancel */
  noBtn.addEventListener('click', function() {
    confirmEl.style.display = 'none';
  });

  /* Confirm → send close request */
  yesBtn.addEventListener('click', function() {
    if (!apiCfg) return;
    yesBtn.disabled = true;
    setStatus('Sending...', '#aaa');
    fetch(apiCfg.api_url + '/close_pair', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiCfg.token
      },
      body: JSON.stringify({ pair_key: PAIR_KEY })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok) {
        setStatus('✅ Close order sent', '#27AE60');
        btn.classList.remove('active');
        btn.classList.add('disabled');
        btn.title = 'Close order already sent';
        setTimeout(function() { confirmEl.style.display = 'none'; }, 1800);
      } else {
        setStatus('❌ ' + (res.data.error || 'Error'), '#E74C3C');
        yesBtn.disabled = false;
      }
    })
    .catch(function(e) {
      setStatus('❌ Network error: ' + e.message, '#E74C3C');
      yesBtn.disabled = false;
    });
  });

  /* Click outside box closes overlay */
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) confirmEl.style.display = 'none';
  });
})();

                        })                };            </script>        </div>
