<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pair Trading — Compact Dashboard</title>

  <meta name="description"
        content="Compact statistical arbitrage dashboard." />

  <style>
    :root {
      --bg: #0d0d1a;
      --panel: #141425;
      --panel-2: #1a1a2e;
      --border: #2e2e4e;
      --accent: #4C9BE8;

      --text: #d0d0e0;
      --muted: #666;

      --radius: 10px;

      /* GLOBAL DASHBOARD SCALE */
      --ui-scale: 0.72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      font-size: 13px;
      line-height: 1.25;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      background:
        linear-gradient(135deg,
        #141425 0%,
        #1a1a35 100%);

      border-bottom: 1px solid var(--border);

      padding: 0.9rem 1.2rem;

      display: flex;
      align-items: center;
      gap: 0.8rem;

      position: sticky;
      top: 0;
      z-index: 10;

      backdrop-filter: blur(4px);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0ff;
      letter-spacing: 0.02em;
    }

    .badge {
      background: var(--accent);
      color: white;

      font-size: 0.62rem;
      font-weight: 700;

      padding: 0.16rem 0.45rem;
      border-radius: 999px;
    }

    .meta {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .density-controls {
      display: flex;
      gap: 0.35rem;
      margin-left: 1rem;
    }

    .density-controls button {
      background: #1f1f35;
      color: #bbb;

      border: 1px solid var(--border);
      border-radius: 5px;

      padding: 0.2rem 0.45rem;

      font-size: 0.68rem;
      cursor: pointer;
    }

    .density-controls button:hover {
      border-color: var(--accent);
      color: white;
    }

    /* =========================
       GRID
       ========================= */

    main {
      display: grid;

      grid-template-columns:
        repeat(auto-fill,
        minmax(min(100%, 430px), 1fr));

      gap: 0.85rem;

      padding: 0.85rem;
    }

    /* =========================
       CARD
       ========================= */

    .card {
      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;

      display: flex;
      flex-direction: column;

      min-height: 280px;

      transition:
        border-color 0.18s,
        box-shadow 0.18s,
        transform 0.12s;
    }

    .card:hover {
      border-color: var(--accent);

      box-shadow:
        0 0 0 1px #4C9BE822,
        0 8px 28px #00000055;

      transform: translateY(-1px);
    }

    /* =========================
       CARD HEADER
       ========================= */

    .card-header {
      padding: 0.45rem 0.7rem;

      background: var(--panel-2);

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .pair-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: #e0e0ff;

      flex: 1;
    }

    .ts-badge {
      font-size: 0.62rem;
      color: var(--muted);

      white-space: nowrap;
    }

    .open-link {
      font-size: 0.65rem;

      color: var(--accent);
      text-decoration: none;

      padding: 0.15rem 0.42rem;

      border: 1px solid #4C9BE844;
      border-radius: 4px;

      transition:
        background 0.15s,
        border-color 0.15s;
    }

    .open-link:hover {
      background: #4C9BE822;
      border-color: var(--accent);
    }

    /* =========================
       IFRAME COMPACTING
       ========================= */

    .iframe-wrapper {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: var(--panel-2);
    }

    iframe {
        position: absolute;
        inset: 0;
    
        border: none;
    
        /* bigger virtual canvas */
        width: 132%;
        height: 132%;
    
        /* stronger shrink */
        transform: scale(var(--ui-scale));
    
        /* anchor top-left */
        transform-origin: top left;
    
        /* shift content left/up */
        margin-left: -11%;
        margin-top: -3%;
    
        background: var(--panel-2);
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      text-align: center;

      padding: 1rem;

      font-size: 0.68rem;
      color: #444;

      border-top: 1px solid var(--border);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
      }

      .meta {
        width: 100%;
        margin-left: 0;
      }

      main {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

  <header>
    <h1>📈 Pair Trading — Compact Dashboard</h1>

    <span class="badge">3 pairs</span>

    <span class="meta">
      Updated: 2026-05-08 23:00 CEST
    </span>

    <div class="density-controls">
      <button onclick="setScale(0.78)">Dense</button>
      <button onclick="setScale(0.84)">Normal</button>
      <button onclick="setScale(0.92)">Large</button>
    </div>
  </header>

  <main>

    <div class="card">
      <div class="card-header">
        <span class="pair-name">MES / MCL</span>

        <span class="ts-badge">
          2026-05-08 23:00 CEST
        </span>

        <a class="open-link"
           href="charts/zscore_MES_MCL.html"
           target="_blank">
           ↗ open
        </a>
      </div>

      <div class="iframe-wrapper">
        <iframe
          src="charts/zscore_MES_MCL.html"
          loading="lazy"
          title="MES / MCL">
        </iframe>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="pair-name">MZS / MES</span>

        <span class="ts-badge">
          2026-05-08 21:00 CEST
        </span>

        <a class="open-link"
           href="charts/zscore_MZS_MES.html"
           target="_blank">
           ↗ open
        </a>
      </div>

      <div class="iframe-wrapper">
        <iframe
          src="charts/zscore_MZS_MES.html"
          loading="lazy"
          title="MZS / MES">
        </iframe>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="pair-name">MES / MZC</span>

        <span class="ts-badge">
          2026-05-08 21:00 CEST
        </span>

        <a class="open-link"
           href="charts/zscore_MES_MZC.html"
           target="_blank">
           ↗ open
        </a>
      </div>

      <div class="iframe-wrapper">
        <iframe
          src="charts/zscore_MES_MZC.html"
          loading="lazy"
          title="MES / MZC">
        </iframe>
      </div>
    </div>

  </main>

  <footer>
    Auto-generated by GitHubChartUploader
    • Compact dashboard edition
  </footer>

  <script>
    function setScale(scale) {
      document.documentElement
        .style
        .setProperty('--ui-scale', scale);
    }
  </script>

</body>
</html>
