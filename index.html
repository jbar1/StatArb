<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Pair Trading — Compact Dashboard</title>

  <meta name="description"
        content="Compact statistical arbitrage dashboard." />

  <style>

    :root {
      --bg: #0d0d1a;

      --panel: #141425;
      --panel-2: #111122;

      --border: #2e2e4e;
      --accent: #4C9BE8;

      --text: #d0d0e0;
      --muted: #666;

      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        'Segoe UI',
        system-ui,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      min-height: 100vh;

      font-size: 12px;
      line-height: 1.2;
    }

    /* =========================
       HEADER
       ========================= */

    header {

      background:
        linear-gradient(
          135deg,
          #141425 0%,
          #1a1a35 100%
        );

      border-bottom:
        1px solid var(--border);

      padding:
        0.7rem 1rem;

      display: flex;
      align-items: center;
      gap: 0.7rem;

      position: sticky;
      top: 0;
      z-index: 10;

      backdrop-filter: blur(5px);
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 600;

      color: #e0e0ff;
      letter-spacing: 0.02em;
    }

    .badge {

      background: var(--accent);
      color: white;

      font-size: 0.58rem;
      font-weight: 700;

      padding:
        0.14rem 0.42rem;

      border-radius: 999px;
    }

    .meta {
      margin-left: auto;

      font-size: 0.65rem;
      color: var(--muted);
    }

    /* =========================
       GRID
       ========================= */

    main {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(min(100%, 430px), 1fr)
        );

      gap: 0.7rem;

      padding: 0.7rem;
    }

    /* =========================
       CARD
       ========================= */

    .card {

      background: var(--panel);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

      display: flex;
      flex-direction: column;

      min-height: 260px;

      transition:
        border-color 0.18s,
        box-shadow 0.18s,
        transform 0.12s;
    }

    .card:hover {

      border-color: var(--accent);

      box-shadow:
        0 0 0 1px #4C9BE822,
        0 8px 24px #00000055;

      transform: translateY(-1px);
    }

    /* =========================
       CARD HEADER
       ========================= */

    .card-header {

      padding:
        0.38rem 0.65rem;

      background: var(--panel-2);

      border-bottom:
        1px solid var(--border);

      display: flex;
      align-items: center;

      gap: 0.4rem;
    }

    .pair-name {

      font-size: 0.78rem;
      font-weight: 600;

      color: #e0e0ff;

      flex: 1;
    }

    .ts-badge {

      font-size: 0.58rem;
      color: var(--muted);

      white-space: nowrap;
    }

    .open-link {

      font-size: 0.62rem;

      color: var(--accent);

      text-decoration: none;

      padding:
        0.12rem 0.38rem;

      border:
        1px solid #4C9BE844;

      border-radius: 4px;

      transition:
        background 0.15s,
        border-color 0.15s;
    }

    .open-link:hover {

      background: #4C9BE822;
      border-color: var(--accent);
    }

    /* =========================
       IFRAME AREA
       ========================= */

    .iframe-wrapper {

      position: relative;

      flex: 1;

      overflow: hidden;

      background: var(--panel-2);
    }

    /* ===================================
       AGGRESSIVE COMPACT CROPPING
       =================================== */

    iframe {

      position: absolute;

      top: 0;
      left: 0;

      border: none;

      /*
        Large virtual canvas
      */

      width: 145%;
      height: 145%;

      /*
        Strong shrink
      */

      transform: scale(0.69);

      transform-origin: top left;

      /*
        Remove right whitespace
      */

      margin-left: -18%;
      margin-top: -4%;

      background: var(--panel-2);
    }

    /* =========================
       FOOTER
       ========================= */

    footer {

      text-align: center;

      padding: 0.9rem;

      font-size: 0.65rem;

      color: #444;

      border-top:
        1px solid var(--border);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      header {
        flex-wrap: wrap;
      }

      .meta {
        width: 100%;
        margin-left: 0;
      }

      main {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

  <header>

    <h1>
      📈 Pair Trading — Compact Dashboard
    </h1>

    <span class="badge">
      3 pairs

    </span>

  <main>

    <!-- =========================

        <a class="open-link"

      <div class="iframe-wrapper">

    <div class="card">

        </span>

        <span class="ts-badge">

        </span>

        <a class="open-link"

      </div>

        <iframe

    </div>

  </main>

</html>
